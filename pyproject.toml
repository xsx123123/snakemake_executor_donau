[tool.poetry]
name = "snakemake-executor-plugin-donau"
version = "0.2.0"
description = "A Snakemake executor plugin for Huawei Donau scheduler"
authors = [
    "Jian Zhang zhangjian199567@outlook.com",
]
readme = "README.md"
license = "MIT"
keywords = ["snakemake", "plugin", "executor", "cluster", "donau"]
exclude = ["rust/target", "Test/runs", "tests/__pycache__"]
include = [
    { path = "Test", format = "sdist" },
    { path = "docs/sidecar.md", format = "sdist" },
    { path = "rust/Cargo.toml", format = "sdist" },
    { path = "rust/Cargo.lock", format = "sdist" },
    { path = "rust/src", format = "sdist" },
    { path = "rust/tests", format = "sdist" },
    { path = "tests", format = "sdist" },
    { path = "scripts/build_sidecar_wheel.py", format = "sdist" },
]

[tool.poetry.dependencies]
python = "^3.8"
snakemake = "^9.0.0"
snakemake-interface-common = "^1.17.1"
snakemake-interface-executor-plugins = "^9.0.0"
loguru = "^0.7.0"

[tool.poetry.plugins."snakemake.executors"]
donau = "snakemake_executor_plugin_donau:Executor"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
